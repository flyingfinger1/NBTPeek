# On a published GitHub release: build, attach the jar to the release, and
# publish the version to Modrinth. Requires the MODRINTH_TOKEN repo secret.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # attach the built jar to the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --no-daemon
      - name: publish to Modrinth + attach to release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: nbtpeek
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/!(*-sources).jar
          loaders: fabric
          game-versions: "26.3"
          version-type: release
          java: "25"
          dependencies: |
            fabric-api(required)
            modmenu(optional)
