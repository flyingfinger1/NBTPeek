plugins {
	// Minecraft 26.1+ is unobfuscated: the non-remapping Loom plugin, no mappings.
	id 'net.fabricmc.fabric-loom' version '1.17.12'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	// Minecraft version in the jar name, e.g. nbtpeek-mc26.3-1.1.0.jar
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
	maven {
		name = 'Mod Menu'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Cloth Config'
		url = 'https://maven.shedaniel.me/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional in-game config screen. Mod Menu provides the entry point;
	// Cloth Config builds the screen and is bundled into the jar.
	implementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
		exclude module: 'fabric-api'
	}
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
		exclude module: 'fabric-api'
	}
	include "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
